name: Stoke tools preparation
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - os: ubuntu-24.04
            system: x86_64-linux
          - os: ubuntu-24.04-arm
            system: aarch64-linux
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      STOKE_TOOLS_SYSTEM: ${{ matrix.system }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          enable_kvm: false
      - name: Build the tools image for the measured runner identity
        shell: bash
        run: |
          STOKE_TOOLS_UID=$(id -u)
          STOKE_TOOLS_GID=$(id -g)
          export STOKE_TOOLS_UID STOKE_TOOLS_GID
          id
          nix build --impure --no-write-lock-file --max-jobs 1 --cores 2 \
            --out-link "$RUNNER_TEMP/stoke-tools" --expr '
              let
                stoke = builtins.getFlake ("path:" + builtins.getEnv "GITHUB_WORKSPACE");
                coopr = builtins.getFlake "github:strio-dev/coopr/35871e4b01e60657b45fd17e04ac1db119f839e6";
              in stoke.lib.mkContainer {
                cooprFlake = coopr;
                system = builtins.getEnv "STOKE_TOOLS_SYSTEM";
                uid = builtins.fromJSON (builtins.getEnv "STOKE_TOOLS_UID");
                gid = builtins.fromJSON (builtins.getEnv "STOKE_TOOLS_GID");
              }'
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import subprocess

          descriptor = Path(os.environ["RUNNER_TEMP"]) / "stoke-tools"
          print(json.dumps({
              "source": subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip(),
              "system": os.environ["STOKE_TOOLS_SYSTEM"],
              "uid": os.getuid(),
              "gid": os.getgid(),
              "descriptorSHA256": hashlib.sha256(descriptor.read_bytes()).hexdigest(),
              "descriptor": str(descriptor.resolve()),
          }, sort_keys=True))
          PY
