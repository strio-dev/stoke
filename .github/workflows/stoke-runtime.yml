name: Stoke native runtime
on:
  push:
    branches: [initial]
  workflow_dispatch:
    inputs:
      scenario:
        description: Approved bounded qualification case
        type: choice
        options: [prepare-images, roundtrip, failure, arm-roundtrip, cache-reuse, candidate, candidate-amd, candidate-arm]
        default: roundtrip
      benchmark_reference:
        description: Include the standalone BuildKit reference in prepared images
        type: boolean
        required: false
        default: false
      trace_patch_b64:
        description: Optional public source patch for tools-image tracing
        type: string
        default: ""
      cache_read:
        description: Read registry cache in the cache-reuse scenario
        type: boolean
        default: true
      expected_manifests:
        description: Optional warm output digests by linux/amd64 and linux/arm64
        type: string
        default: "{}"
permissions:
  contents: read
jobs:
  prepare-images:
    if: ${{ github.event_name == 'workflow_dispatch' && github.repository == 'strio-dev/stoke' && github.ref == 'refs/heads/initial' && inputs.scenario == 'prepare-images' }}
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/stoke-tools-prepare.yml
    with:
      trace_patch_b64: ${{ inputs.trace_patch_b64 }}
      benchmark_reference: ${{ inputs.benchmark_reference }}
  dogfood:
    if: ${{ github.event_name == 'workflow_dispatch' && github.repository == 'strio-dev/stoke' && github.ref == 'refs/heads/initial' && contains(fromJSON('["roundtrip","failure","arm-roundtrip","candidate","candidate-amd","candidate-arm"]'), inputs.scenario) }}
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/stoke-dogfood.yml
    with:
      scenario: ${{ inputs.scenario }}
  cache-reuse:
    if: ${{ github.event_name == 'workflow_dispatch' && github.repository == 'strio-dev/stoke' && github.ref == 'refs/heads/initial' && inputs.scenario == 'cache-reuse' }}
    name: Registry read/write ${{ inputs.cache_read && 'warm' || 'cold' }} build / ${{ matrix.arch }} / vfs
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
            source: 22f540863e3e3bf854bbfb37530de5c0d5305e88
            manifest: sha256:ca7ba59621d845c6192810246dfb4de08f4d6e70e5c6f4df02d8b98401b4106e
            image: ghcr.io/strio-dev/stoke-qualification-tools@sha256:22e3b902505753780e7f98adfeea91048d8fdcdcf811d1adab3c1548c7e73230
            plan: .stoke/hosted-warm.json
            plan_id: 68305e8836bcc80366540ebf8e8b55b6c370c6eead0112d96c6c13ad5b3710e7
            cold_plan: .stoke/hosted-cold.json
            cold_plan_id: 7be44ad88939e561d890e4e30c1069b2e63a18f383cf666f421b97792b7e5301
          - arch: arm64
            runner: ubuntu-24.04-arm
            source: 22f540863e3e3bf854bbfb37530de5c0d5305e88
            manifest: sha256:6c1a7fa3f5b974d1aee84fa81baf0b41ee52a06a2e3a01341ba9b872ef792b9e
            image: ghcr.io/strio-dev/stoke-qualification-tools@sha256:593c25e9cf20d7e4fa454ee18f79da09c75014b848e3e38534034df6d6e6e985
            plan: .stoke/hosted-arm-warm.json
            plan_id: 06e241137e1b331ffa494ed679c549abb44f10e8992a7e2d645aa37d43efcac3
            cold_plan: .stoke/hosted-arm-cold.json
            cold_plan_id: e579174fb6ab1916182914f1b366a3575aabbeb0c98de974072537b129f4d8b8
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    container:
      image: ${{ matrix.image }}
      options: --security-opt seccomp=unconfined --security-opt apparmor=buildah --security-opt systempaths=unconfined --device=/dev/net/tun:/dev/net/tun:rw
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    env:
      APPLICATION_SOURCE: ${{ matrix.source }}
      APPLICATION_PLATFORM: linux/${{ matrix.arch }}
      EXPECTED_MANIFEST: ${{ matrix.manifest }}
      EXPECTED_MANIFESTS: ${{ inputs.expected_manifests || '{}' }}
      CACHE_READ: ${{ inputs.cache_read }}
      STOKE_CI_PLAN: ${{ matrix.plan }}
      STOKE_CI_PLAN_ID: ${{ matrix.plan_id }}
      STOKE_CI_COLD_PLAN: ${{ matrix.cold_plan }}
      STOKE_CI_COLD_PLAN_ID: ${{ matrix.cold_plan_id }}
      GIT_OPTIONAL_LOCKS: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ matrix.source }}
          persist-credentials: false
      - name: Verify the original cold application checkout
        shell: bash
        run: |
          printf 'AVAILABLE_CPUS=%s\n' "$(nproc)"
          grep '^MemTotal:' /proc/meminfo
          test "$(git rev-parse HEAD)" = "$APPLICATION_SOURCE"
          test -z "$(git status --porcelain --untracked-files=all --ignored=matching)"
          printf 'APPLICATION_COMMIT=%s TREE=%s\n' "$APPLICATION_SOURCE" "$(git rev-parse 'HEAD^{tree}')"
          python3 - <<'PY'
          import json, os, re
          overrides = json.loads(os.environ["EXPECTED_MANIFESTS"])
          assert isinstance(overrides, dict) and overrides.keys() <= {"linux/amd64", "linux/arm64"}, "expected a platform-to-digest object"
          assert all(isinstance(value, str) and re.fullmatch(r"sha256:[0-9a-f]{64}", value) for value in overrides.values()), "expected canonical sha256 digests"
          with open(os.environ["GITHUB_ENV"], "a") as output:
              output.write("EXPECTED_MANIFEST=" + overrides.get(os.environ["APPLICATION_PLATFORM"], os.environ["EXPECTED_MANIFEST"]) + "\n")
              if os.environ["CACHE_READ"] == "false":
                  with open(os.environ["STOKE_CI_COLD_PLAN"]) as source:
                      plan = json.load(source)
                  assert plan["id"] == os.environ["STOKE_CI_COLD_PLAN_ID"] and not plan["config"].get("cacheFrom"), "cold plan must have no registry cache reads"
                  assert plan["config"].get("cacheTo") == ["ghcr.io/strio-dev/stoke-qualification-tools"], "cold plan changed the cache destination"
                  output.write("STOKE_CI_PLAN=" + os.environ["STOKE_CI_COLD_PLAN"] + "\nSTOKE_CI_PLAN_ID=" + plan["id"] + "\n")
          PY
      - id: auth
        name: Authenticate registry cache and exact-result publication
        shell: bash
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          umask 077
          auth_dir=$(mktemp -d "$RUNNER_TEMP/stoke-ghcr.XXXXXXXX")
          printf 'directory=%s\n' "$auth_dir" >> "$GITHUB_OUTPUT"
          printf '%s' "$GHCR_TOKEN" | coopr login --authfile "$auth_dir/auth.json" \
            --username "$GHCR_USER" --password-stdin ghcr.io
      - name: Check the frozen Go build and registry cache behavior
        shell: bash
        env:
          STOKE_GHCR_AUTH_DIR: ${{ steps.auth.outputs.directory }}
        run: |
          log="$RUNNER_TEMP/stoke-build-reuse.log"
          printf 'WORKFLOW_COMMIT=%s\n' "$GITHUB_SHA"
          scope=$(GITHUB_SHA="$APPLICATION_SOURCE" stoke ci scope --plan-id "$STOKE_CI_PLAN_ID")
          printf '%s\n' "$scope"
          started_ns=$(python3 -c 'import time; print(time.monotonic_ns())')
          cache_args=()
          if [[ "$CACHE_READ" = true ]]; then cache_args+=(--cache-from ghcr.io/strio-dev/stoke-qualification-tools); fi
          status=0
          stoke ci run --plan "$STOKE_CI_PLAN" --plan-id "$STOKE_CI_PLAN_ID" \
            --job build --scope "$scope" --attempt "$GITHUB_RUN_ATTEMPT" \
            --needs-env --github-output "$GITHUB_OUTPUT" \
            --runtime crun --storage-driver vfs \
            "${cache_args[@]}" \
            --cache-to ghcr.io/strio-dev/stoke-qualification-tools \
            --results-repository ghcr.io/strio-dev/stoke-qualification-tools \
            --authfile "$STOKE_GHCR_AUTH_DIR/auth.json" \
            --cache-dir "$RUNNER_TEMP/stoke-cache" --output "$RUNNER_TEMP/stoke-output" \
            2>&1 | tee "$log" || status=$?
          python3 - "$started_ns" "$APPLICATION_PLATFORM" "$log" <<'PY'
          import json, os, re, sys, time

          elapsed_ns = time.monotonic_ns() - int(sys.argv[1])
          cache_mode = "read-write" if os.environ["CACHE_READ"] == "true" else "write-only"
          print(f"STOKE_BUILD_ELAPSED_NS={elapsed_ns} platform={sys.argv[2]} driver=vfs cache={cache_mode}")
          with open(sys.argv[3]) as stream:
              reports = [json.loads(line) for line in stream if line.startswith('{"status":')]
          report = reports[0] if len(reports) == 1 else {}
          tasks = report.get("tasks", [])
          task = tasks[0] if len(tasks) == 1 else {}
          print("STOKE_BUILD_RESULT=" + json.dumps({"source": os.environ["APPLICATION_SOURCE"], "platform": task.get("platform"), "status": task.get("status", report.get("status", "unreported")), "digest": task.get("digest")}))
          assert len(reports) == 1, "expected one Stoke report"
          assert len(report["tasks"]) == 1, "expected build alone"
          assert report["status"] == "passed" and (task["name"], task["status"], task["kind"], task["platform"]) == ("build", "passed", "image", sys.argv[2]), "build did not pass alone on the expected platform"
          assert isinstance(task.get("digest"), str) and re.fullmatch(r"sha256:[0-9a-f]{64}", task["digest"]), "build output lacks a canonical digest"
          if os.environ["CACHE_READ"] == "true":
              assert task["digest"] == os.environ["EXPECTED_MANIFEST"], "restored output differs from the expected producer"
              print("STOKE_RESTORED_BUILD_DIGEST=" + task["digest"])
          PY
          in_go_run=0
          cached_go_run=0
          executed_go_run=0
          while IFS= read -r line; do
            case "$line" in
              *"STEP "*"RUN "*"go build "*) in_go_run=1 ;;
              *"STEP "*) in_go_run=0 ;;
            esac
            if [[ "$in_go_run" = 1 && "$line" == *"Using cache"* ]]; then cached_go_run=1; fi
            if [[ "$line" == *STOKE_BUILD_EXECUTED && "$line" != *"echo STOKE_BUILD_EXECUTED"* ]]; then
              executed_go_run=1
            fi
          done < "$log"
          if [[ "$CACHE_READ" = true ]]; then
            test "$cached_go_run" = 1
            test "$executed_go_run" = 0
            cache_result=REGISTRY_CACHE_REUSED
          else
            test "$cached_go_run" = 0
            test "$executed_go_run" = 1
            cache_result=COLD_BUILD_EXECUTED
          fi
          test "$(git rev-parse HEAD)" = "$APPLICATION_SOURCE"
          test -z "$(git status --porcelain --untracked-files=all --ignored=matching)"
          test "$status" = 0
          printf 'GO_RUN_%s application=%s\n' "$cache_result" "$APPLICATION_SOURCE"
      - name: Remove registry credentials
        if: ${{ always() && steps.auth.outputs.directory != '' }}
        shell: bash
        env:
          STOKE_GHCR_AUTH_DIR: ${{ steps.auth.outputs.directory }}
        run: |
          rm -f -- "$STOKE_GHCR_AUTH_DIR/auth.json"
          rmdir -- "$STOKE_GHCR_AUTH_DIR"
  runtime:
    if: ${{ github.event_name == 'push' }}
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - os: ubuntu-24.04
            arch: amd64
            sha256: d8db82fe51ef2ba3b2c7deaeb68a42d2daaa44f23cc22b666582e9d8aa082558
          - os: ubuntu-24.04-arm
            arch: arm64
            sha256: 2f45e43a21320cb4f35093a60a12319ef2004f80c2d7e0c461a77e7525337dee
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    env:
      COOPR_ARCH: ${{ matrix.arch }}
      COOPR_SHA256: ${{ matrix.sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Inspect native runner prerequisites without changing security settings
        shell: bash
        run: |
          id
          uname -a
          printf 'Runner image: %s %s\n' "${ImageOS:-unknown}" "${ImageVersion:-unknown}"
          test "$(id -u)" -ne 0
          for setting in /proc/sys/kernel/unprivileged_userns_clone \
            /proc/sys/kernel/apparmor_restrict_unprivileged_userns \
            /proc/sys/user/max_user_namespaces \
            /sys/kernel/security/lsm /sys/module/apparmor/parameters/enabled; do
            if test -r "$setting"; then
              printf '%s=' "$setting"
              cat "$setting"
            fi
          done
          grep -E '^(NoNewPrivs|Seccomp|CapEff|CapBnd):' /proc/self/status
          cat /proc/self/uid_map /proc/self/gid_map
          if test -r /proc/self/attr/current; then cat /proc/self/attr/current; fi
          user=$(id -un)
          uid=$(id -u)
          for file in /etc/subuid /etc/subgid; do
            if test -r "$file"; then awk -F: -v user="$user" -v uid="$uid" '$1 == user || $1 == uid' "$file"; fi
          done
          for helper in newuidmap newgidmap; do
            path=$(command -v "$helper")
            stat -c '%a %u %g %n' "$path"
          done
          if ! unshare --user --map-root-user /bin/true; then
            echo '::error::Runner denies unprivileged user namespace creation. Native container qualification is blocked.'
            exit 1
          fi
          if ! unshare --user --map-root-user unshare --mount /bin/true; then
            echo '::error::Runner denies mount namespace creation inside a user namespace. Native container qualification is blocked.'
            exit 1
          fi
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          enable_kvm: false
      - name: Verify and install the checked Coopr package
        shell: bash
        run: |
          mkdir -m 700 "$RUNNER_TEMP/coopr-package"
          archive="$RUNNER_TEMP/coopr-linux-$COOPR_ARCH.tar.gz"
          curl --fail --location --retry 3 \
            "https://github.com/strio-dev/coopr/releases/download/0.6.0/coopr-linux-$COOPR_ARCH.tar.gz" \
            --output "$archive"
          printf '%s  %s\n' "$COOPR_SHA256" "$archive" | sha256sum --check
          tar --no-same-owner -xzf "$archive" -C "$RUNNER_TEMP/coopr-package" coopr libexec
          "$RUNNER_TEMP/coopr-package/coopr" --version
      - name: Build Stoke from this commit
        shell: bash
        run: nix build --no-update-lock-file --max-jobs 1 --cores 2 path:.#stoke --out-link "$RUNNER_TEMP/stoke"
      - name: Run native mounts and isolated registry roundtrips
        shell: bash
        run: |
          mkdir -m 700 "$RUNNER_TEMP/stoke-runtime-evidence" "$RUNNER_TEMP/stoke-runtime-tmp"
          nix develop --no-update-lock-file --max-jobs 1 --cores 2 path:. -c env \
            STOKE_BINARY="$RUNNER_TEMP/stoke/bin/stoke" \
            STOKE_COOPR_BINARY="$RUNNER_TEMP/coopr-package/coopr" \
            STOKE_CACHE_CI_EVIDENCE_DIR="$RUNNER_TEMP/stoke-runtime-evidence" \
            TMPDIR="$RUNNER_TEMP/stoke-runtime-tmp" \
            GOMAXPROCS=1 GOMEMLIMIT=768MiB GOFLAGS=-p=1 \
            go test -count=1 -v -timeout=12m -parallel=1 ./internal/artifact \
              -run '^(TestMountsAndEnvironmentsWithCoopr|TestRegistryCacheWithCoopr|TestCIRegistryCacheRoundTripWithCoopr)$'
      - name: Read bounded kernel denial context
        if: failure()
        shell: bash
        run: |
          if ! journalctl -k --boot --since '10 minutes ago' --no-pager -n 120 \
            --grep 'apparmor|DENIED|SECCOMP|unshare'; then
            echo 'Kernel denial context is unavailable or has no matching readable entries.'
          fi
      - name: Record bounded runtime summaries
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path

          for name in ("stoke-runtime-evidence", "stoke-runtime-tmp"):
              for path in sorted((Path(os.environ["RUNNER_TEMP"]) / name).glob("*/summary.json")):
                  print(path.read_text())
          PY
