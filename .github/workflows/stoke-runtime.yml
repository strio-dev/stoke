name: Stoke native runtime
on:
  push:
    branches: [initial]
  workflow_dispatch:
    inputs:
      scenario:
        description: Approved bounded qualification case
        type: choice
        options: [prepare-images, roundtrip, failure, arm-roundtrip, cache-reuse, engine-compare, candidate, candidate-amd, candidate-arm, usability]
        default: roundtrip
      benchmark_reference:
        description: Include the standalone BuildKit reference in prepared images
        type: boolean
        required: false
        default: false
      trace_patch_b64:
        description: Optional public source patch for tools-image tracing
        type: string
        default: ""
      cache_read:
        description: Read registry cache in the cache-reuse scenario
        type: boolean
        default: true
      expected_manifests:
        description: Optional warm output digests by linux/amd64 and linux/arm64
        type: string
        default: "{}"
permissions:
  contents: read
jobs:
  prepare-images:
    if: ${{ github.event_name == 'workflow_dispatch' && github.repository == 'strio-dev/stoke' && (github.ref == 'refs/heads/initial' || github.ref == 'refs/heads/qualification/usability-20261115') && inputs.scenario == 'prepare-images' }}
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/stoke-tools-prepare.yml
    with:
      trace_patch_b64: ${{ inputs.trace_patch_b64 }}
      benchmark_reference: ${{ inputs.benchmark_reference }}
  dogfood:
    if: ${{ github.event_name == 'workflow_dispatch' && github.repository == 'strio-dev/stoke' && github.ref == 'refs/heads/initial' && contains(fromJSON('["roundtrip","failure","arm-roundtrip","candidate","candidate-amd","candidate-arm"]'), inputs.scenario) }}
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/stoke-dogfood.yml
    with:
      scenario: ${{ inputs.scenario }}
  cache-reuse:
    if: ${{ github.event_name == 'workflow_dispatch' && github.repository == 'strio-dev/stoke' && github.ref == 'refs/heads/initial' && contains(fromJSON('["cache-reuse","engine-compare"]'), inputs.scenario) }}
    name: ${{ inputs.scenario == 'engine-compare' && 'Engine comparison' || format('Registry read/write {0} build', inputs.cache_read && 'warm' || 'cold') }} / ${{ matrix.arch }} / vfs
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
            source: 22f540863e3e3bf854bbfb37530de5c0d5305e88
            manifest: sha256:ca7ba59621d845c6192810246dfb4de08f4d6e70e5c6f4df02d8b98401b4106e
            image: ghcr.io/strio-dev/stoke-qualification-tools@sha256:22e3b902505753780e7f98adfeea91048d8fdcdcf811d1adab3c1548c7e73230
            benchmark_image: ghcr.io/strio-dev/stoke-qualification-tools@sha256:a37c2c716702ec223c28a756ff9fb9ad8fc0cbed3941dee536df401a3b6ff149
            plan: .stoke/hosted-warm.json
            plan_id: 68305e8836bcc80366540ebf8e8b55b6c370c6eead0112d96c6c13ad5b3710e7
            cold_plan: .stoke/hosted-cold.json
            cold_plan_id: 7be44ad88939e561d890e4e30c1069b2e63a18f383cf666f421b97792b7e5301
          - arch: arm64
            runner: ubuntu-24.04-arm
            source: 22f540863e3e3bf854bbfb37530de5c0d5305e88
            manifest: sha256:6c1a7fa3f5b974d1aee84fa81baf0b41ee52a06a2e3a01341ba9b872ef792b9e
            image: ghcr.io/strio-dev/stoke-qualification-tools@sha256:593c25e9cf20d7e4fa454ee18f79da09c75014b848e3e38534034df6d6e6e985
            benchmark_image: ghcr.io/strio-dev/stoke-qualification-tools@sha256:c65d34a71a451706782841533a5fe7f7c6319465b6d177c1e507a14bca1e0fba
            plan: .stoke/hosted-arm-warm.json
            plan_id: 06e241137e1b331ffa494ed679c549abb44f10e8992a7e2d645aa37d43efcac3
            cold_plan: .stoke/hosted-arm-cold.json
            cold_plan_id: e579174fb6ab1916182914f1b366a3575aabbeb0c98de974072537b129f4d8b8
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    container:
      image: ${{ inputs.scenario == 'engine-compare' && matrix.benchmark_image || matrix.image }}
      options: --security-opt seccomp=unconfined --security-opt apparmor=buildah --security-opt systempaths=unconfined --device=/dev/net/tun:/dev/net/tun:rw
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    env:
      APPLICATION_SOURCE: ${{ matrix.source }}
      APPLICATION_PLATFORM: linux/${{ matrix.arch }}
      EXPECTED_MANIFEST: ${{ matrix.manifest }}
      EXPECTED_MANIFESTS: ${{ inputs.expected_manifests || '{}' }}
      CACHE_READ: ${{ inputs.cache_read }}
      STOKE_CI_PLAN: ${{ matrix.plan }}
      STOKE_CI_PLAN_ID: ${{ matrix.plan_id }}
      STOKE_CI_COLD_PLAN: ${{ matrix.cold_plan }}
      STOKE_CI_COLD_PLAN_ID: ${{ matrix.cold_plan_id }}
      GIT_OPTIONAL_LOCKS: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ matrix.source }}
          persist-credentials: false
          path: ${{ inputs.scenario == 'engine-compare' && 'application' || '.' }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: ${{ inputs.scenario == 'engine-compare' }}
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          path: benchmark-harness
      - name: Verify the original cold application checkout
        working-directory: ${{ inputs.scenario == 'engine-compare' && 'application' || '.' }}
        shell: bash
        run: |
          printf 'AVAILABLE_CPUS=%s\n' "$(nproc)"
          grep '^MemTotal:' /proc/meminfo
          test "$(git rev-parse HEAD)" = "$APPLICATION_SOURCE"
          test -z "$(git status --porcelain --untracked-files=all --ignored=matching)"
          printf 'APPLICATION_COMMIT=%s TREE=%s\n' "$APPLICATION_SOURCE" "$(git rev-parse 'HEAD^{tree}')"
          python3 - <<'PY'
          import json, os, re
          overrides = json.loads(os.environ["EXPECTED_MANIFESTS"])
          assert isinstance(overrides, dict) and overrides.keys() <= {"linux/amd64", "linux/arm64"}, "expected a platform-to-digest object"
          assert all(isinstance(value, str) and re.fullmatch(r"sha256:[0-9a-f]{64}", value) for value in overrides.values()), "expected canonical sha256 digests"
          with open(os.environ["GITHUB_ENV"], "a") as output:
              output.write("EXPECTED_MANIFEST=" + overrides.get(os.environ["APPLICATION_PLATFORM"], os.environ["EXPECTED_MANIFEST"]) + "\n")
              if os.environ["CACHE_READ"] == "false":
                  with open(os.environ["STOKE_CI_COLD_PLAN"]) as source:
                      plan = json.load(source)
                  assert plan["id"] == os.environ["STOKE_CI_COLD_PLAN_ID"] and not plan["config"].get("cacheFrom"), "cold plan must have no registry cache reads"
                  assert plan["config"].get("cacheTo") == ["ghcr.io/strio-dev/stoke-qualification-tools"], "cold plan changed the cache destination"
                  output.write("STOKE_CI_PLAN=" + os.environ["STOKE_CI_COLD_PLAN"] + "\nSTOKE_CI_PLAN_ID=" + plan["id"] + "\n")
          PY
      - id: auth
        name: Authenticate registry cache and exact-result publication
        shell: bash
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          umask 077
          auth_dir=$(mktemp -d "$RUNNER_TEMP/stoke-ghcr.XXXXXXXX")
          printf 'directory=%s\n' "$auth_dir" >> "$GITHUB_OUTPUT"
          printf '%s' "$GHCR_TOKEN" | coopr login --authfile "$auth_dir/auth.json" \
            --username "$GHCR_USER" --password-stdin ghcr.io
      - name: Check the frozen Go build and registry cache behavior
        if: ${{ inputs.scenario == 'cache-reuse' }}
        shell: bash
        env:
          STOKE_GHCR_AUTH_DIR: ${{ steps.auth.outputs.directory }}
        run: |
          log="$RUNNER_TEMP/stoke-build-reuse.log"
          printf 'WORKFLOW_COMMIT=%s\n' "$GITHUB_SHA"
          scope=$(GITHUB_SHA="$APPLICATION_SOURCE" stoke ci scope --plan-id "$STOKE_CI_PLAN_ID")
          printf '%s\n' "$scope"
          started_ns=$(python3 -c 'import time; print(time.monotonic_ns())')
          cache_args=()
          if [[ "$CACHE_READ" = true ]]; then cache_args+=(--cache-from ghcr.io/strio-dev/stoke-qualification-tools); fi
          status=0
          stoke ci run --plan "$STOKE_CI_PLAN" --plan-id "$STOKE_CI_PLAN_ID" \
            --job build --scope "$scope" --attempt "$GITHUB_RUN_ATTEMPT" \
            --needs-env --github-output "$GITHUB_OUTPUT" \
            --runtime crun --storage-driver vfs \
            "${cache_args[@]}" \
            --cache-to ghcr.io/strio-dev/stoke-qualification-tools \
            --results-repository ghcr.io/strio-dev/stoke-qualification-tools \
            --authfile "$STOKE_GHCR_AUTH_DIR/auth.json" \
            --cache-dir "$RUNNER_TEMP/stoke-cache" --output "$RUNNER_TEMP/stoke-output" \
            2>&1 | tee "$log" || status=$?
          python3 - "$started_ns" "$APPLICATION_PLATFORM" "$log" <<'PY'
          import json, os, re, sys, time

          elapsed_ns = time.monotonic_ns() - int(sys.argv[1])
          cache_mode = "read-write" if os.environ["CACHE_READ"] == "true" else "write-only"
          print(f"STOKE_BUILD_ELAPSED_NS={elapsed_ns} platform={sys.argv[2]} driver=vfs cache={cache_mode}")
          with open(sys.argv[3]) as stream:
              reports = [json.loads(line) for line in stream if line.startswith('{"status":')]
          report = reports[0] if len(reports) == 1 else {}
          tasks = report.get("tasks", [])
          task = tasks[0] if len(tasks) == 1 else {}
          print("STOKE_BUILD_RESULT=" + json.dumps({"source": os.environ["APPLICATION_SOURCE"], "platform": task.get("platform"), "status": task.get("status", report.get("status", "unreported")), "digest": task.get("digest")}))
          assert len(reports) == 1, "expected one Stoke report"
          assert len(report["tasks"]) == 1, "expected build alone"
          assert report["status"] == "passed" and (task["name"], task["status"], task["kind"], task["platform"]) == ("build", "passed", "image", sys.argv[2]), "build did not pass alone on the expected platform"
          assert isinstance(task.get("digest"), str) and re.fullmatch(r"sha256:[0-9a-f]{64}", task["digest"]), "build output lacks a canonical digest"
          if os.environ["CACHE_READ"] == "true":
              assert task["digest"] == os.environ["EXPECTED_MANIFEST"], "restored output differs from the expected producer"
              print("STOKE_RESTORED_BUILD_DIGEST=" + task["digest"])
          PY
          in_go_run=0
          cached_go_run=0
          executed_go_run=0
          while IFS= read -r line; do
            case "$line" in
              *"STEP "*"RUN "*"go build "*) in_go_run=1 ;;
              *"STEP "*) in_go_run=0 ;;
            esac
            if [[ "$in_go_run" = 1 && "$line" == *"Using cache"* ]]; then cached_go_run=1; fi
            if [[ "$line" == *STOKE_BUILD_EXECUTED && "$line" != *"echo STOKE_BUILD_EXECUTED"* ]]; then
              executed_go_run=1
            fi
          done < "$log"
          if [[ "$CACHE_READ" = true ]]; then
            test "$cached_go_run" = 1
            test "$executed_go_run" = 0
            cache_result=REGISTRY_CACHE_REUSED
          else
            test "$cached_go_run" = 0
            test "$executed_go_run" = 1
            cache_result=COLD_BUILD_EXECUTED
          fi
          test "$(git rev-parse HEAD)" = "$APPLICATION_SOURCE"
          test -z "$(git status --porcelain --untracked-files=all --ignored=matching)"
          test "$status" = 0
          printf 'GO_RUN_%s application=%s\n' "$cache_result" "$APPLICATION_SOURCE"
      - name: Compare direct native Coopr and BuildKit cold and warm builds
        if: ${{ inputs.scenario == 'engine-compare' }}
        working-directory: application
        shell: bash
        env:
          STOKE_GHCR_AUTH_DIR: ${{ steps.auth.outputs.directory }}
        run: |
          printf 'BENCHMARK_HARNESS_SOURCE=%s\n' "$GITHUB_SHA"
          timeout --signal=TERM --kill-after=10s 35m \
            bash "$GITHUB_WORKSPACE/benchmark-harness/benchmarks/buildkit-reference/compare.sh"
      - name: Remove registry credentials
        if: ${{ always() && steps.auth.outputs.directory != '' }}
        shell: bash
        env:
          STOKE_GHCR_AUTH_DIR: ${{ steps.auth.outputs.directory }}
        run: |
          rm -f -- "$STOKE_GHCR_AUTH_DIR/auth.json"
          rmdir -- "$STOKE_GHCR_AUTH_DIR"
  runtime:
    if: ${{ github.event_name == 'push' }}
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - os: ubuntu-24.04
            arch: amd64
            sha256: d8db82fe51ef2ba3b2c7deaeb68a42d2daaa44f23cc22b666582e9d8aa082558
          - os: ubuntu-24.04-arm
            arch: arm64
            sha256: 2f45e43a21320cb4f35093a60a12319ef2004f80c2d7e0c461a77e7525337dee
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    env:
      COOPR_ARCH: ${{ matrix.arch }}
      COOPR_SHA256: ${{ matrix.sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Inspect native runner prerequisites without changing security settings
        shell: bash
        run: |
          id
          uname -a
          printf 'Runner image: %s %s\n' "${ImageOS:-unknown}" "${ImageVersion:-unknown}"
          test "$(id -u)" -ne 0
          for setting in /proc/sys/kernel/unprivileged_userns_clone \
            /proc/sys/kernel/apparmor_restrict_unprivileged_userns \
            /proc/sys/user/max_user_namespaces \
            /sys/kernel/security/lsm /sys/module/apparmor/parameters/enabled; do
            if test -r "$setting"; then
              printf '%s=' "$setting"
              cat "$setting"
            fi
          done
          grep -E '^(NoNewPrivs|Seccomp|CapEff|CapBnd):' /proc/self/status
          cat /proc/self/uid_map /proc/self/gid_map
          if test -r /proc/self/attr/current; then cat /proc/self/attr/current; fi
          user=$(id -un)
          uid=$(id -u)
          for file in /etc/subuid /etc/subgid; do
            if test -r "$file"; then awk -F: -v user="$user" -v uid="$uid" '$1 == user || $1 == uid' "$file"; fi
          done
          for helper in newuidmap newgidmap; do
            path=$(command -v "$helper")
            stat -c '%a %u %g %n' "$path"
          done
          if ! unshare --user --map-root-user /bin/true; then
            echo '::error::Runner denies unprivileged user namespace creation. Native container qualification is blocked.'
            exit 1
          fi
          if ! unshare --user --map-root-user unshare --mount /bin/true; then
            echo '::error::Runner denies mount namespace creation inside a user namespace. Native container qualification is blocked.'
            exit 1
          fi
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          enable_kvm: false
      - name: Verify and install the checked Coopr package
        shell: bash
        run: |
          mkdir -m 700 "$RUNNER_TEMP/coopr-package"
          archive="$RUNNER_TEMP/coopr-linux-$COOPR_ARCH.tar.gz"
          curl --fail --location --retry 3 \
            "https://github.com/strio-dev/coopr/releases/download/0.6.0/coopr-linux-$COOPR_ARCH.tar.gz" \
            --output "$archive"
          printf '%s  %s\n' "$COOPR_SHA256" "$archive" | sha256sum --check
          tar --no-same-owner -xzf "$archive" -C "$RUNNER_TEMP/coopr-package" coopr libexec
          "$RUNNER_TEMP/coopr-package/coopr" --version
      - name: Build Stoke from this commit
        shell: bash
        run: nix build --no-update-lock-file --max-jobs 1 --cores 2 path:.#stoke --out-link "$RUNNER_TEMP/stoke"
      - name: Run native mounts and isolated registry roundtrips
        shell: bash
        run: |
          mkdir -m 700 "$RUNNER_TEMP/stoke-runtime-evidence" "$RUNNER_TEMP/stoke-runtime-tmp"
          nix develop --no-update-lock-file --max-jobs 1 --cores 2 path:. -c env \
            STOKE_BINARY="$RUNNER_TEMP/stoke/bin/stoke" \
            STOKE_COOPR_BINARY="$RUNNER_TEMP/coopr-package/coopr" \
            STOKE_CACHE_CI_EVIDENCE_DIR="$RUNNER_TEMP/stoke-runtime-evidence" \
            TMPDIR="$RUNNER_TEMP/stoke-runtime-tmp" \
            GOMAXPROCS=1 GOMEMLIMIT=768MiB GOFLAGS=-p=1 \
            go test -count=1 -v -timeout=12m -parallel=1 ./internal/artifact \
              -run '^(TestMountsAndEnvironmentsWithCoopr|TestRegistryCacheWithCoopr|TestCIRegistryCacheRoundTripWithCoopr)$'
      - name: Read bounded kernel denial context
        if: failure()
        shell: bash
        run: |
          if ! journalctl -k --boot --since '10 minutes ago' --no-pager -n 120 \
            --grep 'apparmor|DENIED|SECCOMP|unshare'; then
            echo 'Kernel denial context is unavailable or has no matching readable entries.'
          fi
      - name: Record bounded runtime summaries
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path

          for name in ("stoke-runtime-evidence", "stoke-runtime-tmp"):
              for path in sorted((Path(os.environ["RUNNER_TEMP"]) / name).glob("*/summary.json")):
                  print(path.read_text())
          PY

  usability:
    if: ${{ github.event_name == 'workflow_dispatch' && github.repository == 'strio-dev/stoke' && github.ref == 'refs/heads/qualification/usability-20261115' && inputs.scenario == 'usability' }}
    name: First run / ${{ matrix.arch }}
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - arch: amd64
            machine: x86_64
            runner: ubuntu-24.04
            image: ghcr.io/strio-dev/stoke-qualification-tools@sha256:40880acda8f3741984ca5ee82d7465e880b9010f09669b3ba1b5c4ca029f0195
            archive_sha: d8db82fe51ef2ba3b2c7deaeb68a42d2daaa44f23cc22b666582e9d8aa082558
          - arch: arm64
            machine: aarch64
            runner: ubuntu-24.04-arm
            image: ghcr.io/strio-dev/stoke-qualification-tools@sha256:6dc0b43ebf6bf84232dde2395ddeec5e5f9decf56020aed088d6d915b88a55e5
            archive_sha: 2f45e43a21320cb4f35093a60a12319ef2004f80c2d7e0c461a77e7525337dee
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
    container:
      image: ${{ matrix.image }}
      options: --security-opt seccomp=unconfined --security-opt apparmor=buildah --security-opt systempaths=unconfined --device=/dev/net/tun:/dev/net/tun:rw
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    env:
      TOOLS_SOURCE: 8d15fc000fe2eaf66173f73544922eba338385be
      TOOLS_IMAGE: ${{ matrix.image }}
      NATIVE_ARCH: ${{ matrix.arch }}
      NATIVE_MACHINE: ${{ matrix.machine }}
      COOPR_ARCHIVE_SHA: ${{ matrix.archive_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TOOLS_SOURCE }}
          persist-credentials: false
      - name: Require the exact source and native non-root identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(id -u):$(id -g)" = 1001:1001
          test "$(uname -m)" = "$NATIVE_MACHINE"
          test "$(git rev-parse HEAD)" = "$TOOLS_SOURCE"
      - id: installer
        name: Exercise the public latest installer without sudo
        shell: bash
        run: |
          set -euo pipefail
          proof=$(mktemp -d "$RUNNER_TEMP/stoke-first-run.XXXXXXXX")
          prefix="$proof/installed"
          curl -fsSL --proto '=https' --proto-redir '=https' \
            https://coopr.strio.dev/install.sh -o "$proof/install.sh"
          printf '%s  %s\n' 94f85093a63b4ad338fadff162144c230049d668ffcc5922d0de07a4917f2cfc "$proof/install.sh" | sha256sum -c -
          latest=$(curl -fsSLI --proto '=https' --proto-redir '=https' -o /dev/null -w '%{url_effective}' https://github.com/strio-dev/coopr/releases/latest)
          test "$latest" = https://github.com/strio-dev/coopr/releases/tag/0.6.0
          COOPR_INSTALL_PREFIX="$prefix" sh "$proof/install.sh"
          archive="$proof/coopr-linux-$NATIVE_ARCH.tar.gz"
          curl -fsSL --proto '=https' --proto-redir '=https' \
            "https://github.com/strio-dev/coopr/releases/download/0.6.0/coopr-linux-$NATIVE_ARCH.tar.gz" -o "$archive"
          printf '%s  %s\n' "$COOPR_ARCHIVE_SHA" "$archive" | sha256sum -c -
          mkdir "$proof/expected"
          tar --no-same-owner -xzf "$archive" -C "$proof/expected" coopr libexec
          cmp "$prefix/bin/coopr" "$proof/expected/coopr"
          cmp "$prefix/libexec/coopr/coopr-run-sequence" "$proof/expected/libexec/coopr/coopr-run-sequence"
          test -f "$prefix/share/licenses/coopr/LICENSE"
          printf 'directory=%s\nprefix=%s\n' "$proof" "$prefix" >> "$GITHUB_OUTPUT"
      - name: Qualify default-network first run and human diagnostics
        env:
          PROOF_DIR: ${{ steps.installer.outputs.directory }}
          INSTALLED_PREFIX: ${{ steps.installer.outputs.prefix }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYTHON'
          from datetime import datetime
          import hashlib, html, json, os, pathlib, shutil, subprocess

          root = pathlib.Path(os.environ['PROOF_DIR'])
          prefix = pathlib.Path(os.environ['INSTALLED_PREFIX'])
          env = os.environ.copy()
          env.pop('STOKE_COOPR_BINARY', None)
          env['PATH'] = str(prefix / 'bin') + os.pathsep + env['PATH']
          env['XDG_STATE_HOME'] = str(root / 'state')
          env['XDG_CACHE_HOME'] = str(root / 'cache')
          assert shutil.which('coopr', path=env['PATH']) == str(prefix / 'bin/coopr')
          cli = pathlib.Path(shutil.which('stoke', path=env['PATH'])).resolve()
          elf = cli.with_name('.stoke-wrapped')
          assert elf.is_file()
          sha = lambda path: hashlib.sha256(path.read_bytes()).hexdigest()
          version = subprocess.check_output(['coopr', '--version'], env=env, text=True).strip()
          assert '0.6.0' in version

          def invoke(label, args, expected):
              assert '--network' not in args and not any(a.startswith('--network=') for a in args)
              result = subprocess.run(['stoke'] + args, env=env, capture_output=True, text=True, timeout=120)
              (root / (label + '.stdout')).write_text(result.stdout)
              (root / (label + '.stderr')).write_text(result.stderr)
              if result.returncode != expected:
                  print('\n'.join(result.stderr.splitlines()[-25:]))
              assert result.returncode == expected, (label, result.returncode)
              return result

          fixture = 'examples/first-workflow/stoke.yaml'
          invoke('check', ['check', '-f', fixture], 0)
          plan = invoke('plan', ['plan', '-f', fixture, 'artifact'], 0).stdout
          assert 'artifact\tcache=true\tneeds=test\tdata-from=build' in plan
          assert 'test\tcache=false\tneeds=\tdata-from=build' in plan
          output, events = root / 'happy-output', root / 'happy-events.jsonl'
          happy_args = ['run', '-f', fixture, '--output', str(output), '--events', str(events), 'artifact']
          happy = json.loads(invoke('happy', happy_args, 0).stdout)
          assert happy['status'] == 'passed'
          assert [(t['name'], t['status']) for t in happy['tasks']] == [('build', 'passed'), ('test', 'passed'), ('artifact', 'passed')]
          artifact = happy['tasks'][-1]
          assert (pathlib.Path(artifact['filesystem']) / 'message.txt').read_text() == 'HELLO FROM STOKE\n'
          assert pathlib.Path(artifact['oci']).is_dir()
          assert (pathlib.Path(happy['directory']) / 'run.json').is_file()
          saved_events = events.read_bytes()
          event_args = happy_args.copy()
          event_output = root / 'events-collision-output'
          event_args[event_args.index('--output') + 1] = str(event_output)
          rejected = invoke('existing-events', event_args, 1)
          assert not rejected.stdout and 'exist' in rejected.stderr
          assert events.read_bytes() == saved_events and not event_output.exists()
          output_args = happy_args.copy()
          output_args[output_args.index('--events') + 1] = str(root / 'fresh-retry-events.jsonl')
          rejected = invoke('existing-output', output_args, 1)
          assert not rejected.stdout and 'output directory already exists' in rejected.stderr
          assert (output / 'artifact/rootfs/message.txt').read_text() == 'HELLO FROM STOKE\n'

          failed_source = root / 'failed-source'
          failed_source.mkdir()
          shutil.copyfile(fixture, failed_source / 'stoke.yaml')
          (failed_source / 'message.txt').write_text('unexpected\n')
          failed_output, failed_events = root / 'failed-output', root / 'failed-events.jsonl'
          failed = invoke('failed-gate', ['run', '-f', str(failed_source / 'stoke.yaml'), '--output', str(failed_output), '--events', str(failed_events), 'artifact'], 1)
          report = json.loads(failed.stdout)
          assert report['status'] == 'failed'
          assert [(t['name'], t['status']) for t in report['tasks']] == [('build', 'passed'), ('test', 'failed'), ('artifact', 'skipped')]
          report_path = str(pathlib.Path(report['directory']) / 'run.json')
          assert pathlib.Path(report_path).is_file()
          for text in ['Failed tasks: test', report_path, 'original gated targets: artifact', 'fresh --output', 'fresh --events']:
              assert text in failed.stderr
              assert text in html.unescape(pathlib.Path(env['GITHUB_STEP_SUMMARY']).read_text())

          parallel = root / 'parallel-source'
          parallel.mkdir()
          (parallel / 'stoke.yaml').write_text('''version: 1
          tasks:
            check:
              image: docker.io/library/busybox:1.37
              cache: false
              strategy: {max-parallel: 2, matrix: {mode: [one, two]}}
              steps:
                - run: [sh, -eu, -c, "printf frag; sleep 2; printf 'mented\\nmulti\\nlast'; printf errtail >&2"]
          ''')
          parallel_events = root / 'parallel-events.jsonl'
          result = invoke('parallel', ['run', '-f', str(parallel / 'stoke.yaml'), '--events', str(parallel_events), 'check'], 0)
          variants = json.loads(result.stdout)
          assert variants['status'] == 'passed' and len(variants['tasks']) == 2
          for task in variants['tasks']:
              assert task['status'] == 'passed'
              for line in ['fragmented', 'multi', 'last', 'errtail']:
                  assert result.stderr.splitlines().count('[' + task['name'] + '] ' + line) == 1
          starts, finishes = {}, {}
          for line in parallel_events.read_text().splitlines():
              event = json.loads(line)
              kind = event['context']['type']
              if kind.startswith('dev.cdevents.taskrun.'):
                  times = starts if '.started.' in kind else finishes
                  times[event['subject']['id']] = datetime.fromisoformat(event['context']['timestamp'])
          assert len(starts) == len(finishes) == 2 and starts.keys() == finishes.keys()
          assert max(starts.values()) < min(finishes.values())
          print('STOKE_USABILITY_RECEIPT=' + json.dumps({
              'source': os.environ['TOOLS_SOURCE'], 'caller': os.environ['GITHUB_SHA'],
              'image': os.environ['TOOLS_IMAGE'], 'arch': os.environ['NATIVE_ARCH'],
              'stokeELFSHA256': sha(elf), 'stokeWrapperSHA256': sha(cli),
              'installerSHA256': sha(root / 'install.sh'), 'installerMode': 'real public no-argument latest; writable prefix; no sudo',
              'cooprVersion': version, 'cooprSource': '35871e4b01e60657b45fd17e04ac1db119f839e6',
              'cooprBinarySHA256': sha(prefix / 'bin/coopr'),
              'cooprHelperSHA256': sha(prefix / 'libexec/coopr/coopr-run-sequence'),
              'cooprArchiveSHA256': os.environ['COOPR_ARCHIVE_SHA'],
              'network': 'default; no CLI or workflow overrides',
              'passed': ['installer-native-archive-parity', 'plan-gates-data', 'first-artifact', 'failed-gate', 'json-stdout', 'provider-summary', 'no-overwrite', 'overlapping-variant-logs']
          }, sort_keys=True))
