name: CI
on:
  push:
    branches: [main, initial]
  pull_request:
  workflow_dispatch:
    inputs:
      registry_qualification:
        description: Publish and read back the approved private tools package without executing it
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          enable_kvm: false
      - name: Check workflows and docs
        run: nix flake check --no-update-lock-file --print-build-logs path:.
  registry:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.registry_qualification && github.repository == 'strio-dev/stoke' && github.ref == 'refs/heads/initial' }}
    needs: [check]
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/stoke-registry-qualification.yml
