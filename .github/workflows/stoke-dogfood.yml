# Called only by the manually selected, approved bounded qualification batch.
name: Stoke dogfood
on:
  workflow_call:
    inputs:
      scenario:
        description: AMD or ARM roundtrip, or intentional failure
        required: true
        type: string
permissions:
  contents: read
  packages: write
jobs:
  cold:
    if: ${{ inputs.scenario == 'roundtrip' }}
    uses: ./.github/workflows/hosted-cold.generated.yml
  warm:
    needs: [cold]
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        invocation: [first, second]
    name: Warm / ${{ matrix.invocation }}
    uses: ./.github/workflows/hosted-warm.generated.yml
  failure:
    if: ${{ inputs.scenario == 'failure' }}
    uses: ./.github/workflows/hosted-failure.generated.yml
  arm-cold:
    if: ${{ inputs.scenario == 'arm-roundtrip' }}
    uses: ./.github/workflows/hosted-arm-cold.generated.yml
  arm-warm:
    needs: [arm-cold]
    uses: ./.github/workflows/hosted-arm-warm.generated.yml
  candidate-amd:
    if: ${{ inputs.scenario == 'candidate' || inputs.scenario == 'candidate-amd' }}
    uses: ./.github/workflows/hosted-warm.generated.yml
  candidate-arm:
    if: ${{ inputs.scenario == 'candidate' || inputs.scenario == 'candidate-arm' }}
    uses: ./.github/workflows/hosted-arm-warm.generated.yml
