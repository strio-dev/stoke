# Called only by the manually selected, approved bounded qualification batch.
name: Stoke dogfood
on:
  workflow_call:
    inputs:
      scenario:
        description: roundtrip or intentional failure; retries use native job reruns
        required: true
        type: string
permissions:
  contents: read
  packages: write
jobs:
  validate-generated:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      packages: read
    env:
      STOKE_SCENARIO: ${{ inputs.scenario }}
    container:
      image: ghcr.io/strio-dev/stoke-qualification-tools@sha256:3d6da25e0dcdf669517843c4654b50e6bc3a688145e265523edf46bc8c99b6d7
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify the reviewed generated pairs without executing tasks
        shell: bash
        run: |
          case "$STOKE_SCENARIO" in
            roundtrip|failure) ;;
            *) printf 'Unknown qualification scenario\n' >&2; exit 2 ;;
          esac
          common=(--context . --runner ubuntu-24.04 --timeout 45
            --job-container-image ghcr.io/strio-dev/stoke-qualification-tools@sha256:3d6da25e0dcdf669517843c4654b50e6bc3a688145e265523edf46bc8c99b6d7
            --job-container-options '--security-opt seccomp=unconfined --security-opt apparmor=buildah --security-opt systempaths=unconfined'
            --github-token-auth
            --cache-to ghcr.io/strio-dev/stoke-qualification-tools
            --results-repository ghcr.io/strio-dev/stoke-qualification-tools)
          stoke ci generate --check "${common[@]}" -f examples/ci/stoke.yaml \
            --plan-output .stoke/hosted-cold.json --output .github/workflows/hosted-cold.generated.yml package
          stoke ci generate --check "${common[@]}" -f examples/ci/stoke.yaml \
            --cache-from ghcr.io/strio-dev/stoke-qualification-tools \
            --plan-output .stoke/hosted-warm.json --output .github/workflows/hosted-warm.generated.yml package
          stoke ci generate --check "${common[@]}" -f examples/ci/failure.yaml \
            --cache-from ghcr.io/strio-dev/stoke-qualification-tools \
            --plan-output .stoke/hosted-failure.json --output .github/workflows/hosted-failure.generated.yml package
  cold:
    if: ${{ inputs.scenario == 'roundtrip' }}
    needs: [validate-generated]
    uses: ./.github/workflows/hosted-cold.generated.yml
  warm:
    needs: [cold]
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        invocation: [first, second]
    name: Warm / ${{ matrix.invocation }}
    uses: ./.github/workflows/hosted-warm.generated.yml
  failure:
    if: ${{ inputs.scenario == 'failure' }}
    needs: [validate-generated]
    uses: ./.github/workflows/hosted-failure.generated.yml
