version: 1
tasks:
  build:
    coopr:
      files: [examples/ci/build.coopr]
      target: binary
    outputs: {filesystem: false}
  checks:
    needs: [build]
    cache: false
    outputs: {filesystem: false}
    image: docker.io/library/golang:1.27@sha256:e519d3b0a5b285e5aa53ab9eef02bc6bbb9cb04608389b743a136a9ce75f0d1e
    workdir: /workspace
    strategy:
      max-parallel: 2
      fail-fast: false
      matrix:
        check: [test, vet]
        workers: ["1", "2"]
    env:
      CGO_ENABLED: "0"
      GOTOOLCHAIN: local
      GOMAXPROCS: "1"
      GOMEMLIMIT: 768MiB
      GOFLAGS: -p=1
      GOCACHE: /cache/build
      GOMODCACHE: /cache/modules
    mounts:
      - type: context
        source: .
        target: /workspace
      - type: stage
        from: build
        target: /built
      - type: cache
        id: stoke-ci-go-build
        sharing: locked
        target: /cache/build
      - type: cache
        id: stoke-ci-go-modules
        sharing: locked
        target: /cache/modules
    steps:
      - run:
          - sh
          - -eu
          - -c
          - |
            printf 'STOKE_TESTED_BINARY_SHA256=%s\n' "$(sha256sum /built/stoke | cut -d ' ' -f 1)"
            export GOMAXPROCS="$STOKE_MATRIX_WORKERS" GOFLAGS="-p=$STOKE_MATRIX_WORKERS"
            build_cache_entries=$(ls -A "$GOCACHE")
            module_cache_entries=$(ls -A "$GOMODCACHE")
            test -z "$build_cache_entries$module_cache_entries"
            printf 'CPU_CACHES_EMPTY worker=%s check=%s\n' "$STOKE_MATRIX_WORKERS" "$STOKE_MATRIX_CHECK"
            /built/stoke version
            printf 'CPU_GO_BEGIN worker=%s check=%s ns=%s gomax=%s flags=%s mem=%s\n' "$STOKE_MATRIX_WORKERS" "$STOKE_MATRIX_CHECK" "$(date +%s%N)" "$GOMAXPROCS" "$GOFLAGS" "$GOMEMLIMIT"
            case "$STOKE_MATRIX_CHECK" in
              test) go test -count=1 -mod=readonly -short ./... ;;
              vet) go vet -mod=readonly ./... ;;
              *) exit 2 ;;
            esac
            printf 'CPU_GO_END worker=%s check=%s ns=%s\n' "$STOKE_MATRIX_WORKERS" "$STOKE_MATRIX_CHECK" "$(date +%s%N)"
  package:
    image: docker.io/library/busybox:1.37@sha256:a7dbc319b1438115a207e11930dc4bb3e643dcb3ec0bdd694bb36cd8fad289ec
    needs: [checks]
    steps:
      - copy:
          from: build
          sources: [/stoke]
          destination: /dist/stoke
      - run:
          - sh
          - -eu
          - -c
          - |
            printf 'STOKE_PACKAGED_BINARY_SHA256=%s\n' "$(sha256sum /dist/stoke | cut -d ' ' -f 1)"
            /dist/stoke version
