version: 1

tasks:
  build:
    image: docker.io/library/busybox:1.37
    workdir: /work
    steps:
      - copy:
          sources: [message.txt]
          destination: /work/message.txt
      - run: |
          mkdir -p /out
          tr a-z A-Z < message.txt > /out/message.txt

  test:
    from: build
    cache: false
    steps:
      - run: |
          test "$(cat /out/message.txt)" = "HELLO FROM STOKE"

  artifact:
    from: build
    needs: [test]
    steps:
      - export:
          source: /out/message.txt
          destination: dist/message.txt
