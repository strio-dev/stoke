version: 1
inputs:
  native-platform:
    default: linux/amd64
tasks:
  prepare:
    platform: {input: native-platform}
    host:
      tools: [python3]
      inputs:
        - path: examples/host/message.txt
      outputs: [out]
    cache: false
    steps:
      - run:
          - python3
          - -c
          - |
            from pathlib import Path
            Path("out").mkdir()
            Path("out/value.txt").write_bytes(Path("examples/host/message.txt").read_bytes())
            print("HOST_PREPARE_EXECUTED")
  verify:
    platform: {input: native-platform}
    host:
      tools: [python3]
      inputs:
        - from: prepare
          path: out
          destination: input
      outputs: [reports]
    cache: false
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        check: [contents, shape]
    steps:
      - run:
          - python3
          - -c
          - |
            import hashlib, json, os
            from pathlib import Path
            data = Path("input/value.txt").read_bytes()
            mode = os.environ["STOKE_MATRIX_CHECK"]
            if mode == "contents":
                assert data == b"Stoke captured this producer output.\n"
            elif mode == "shape":
                assert sorted(p.name for p in Path("input").iterdir()) == ["value.txt"]
            else:
                raise ValueError("unexpected matrix variant")
            Path("reports").mkdir()
            Path("reports/checked.json").write_text(json.dumps({"check": mode, "producerSHA256": hashlib.sha256(data).hexdigest()}) + "\n")
            print("HOST_VERIFY_EXECUTED", mode)
  package:
    needs: [verify]
    platform: {input: native-platform}
    host:
      tools: [python3]
      inputs:
        - from: prepare
          path: out
          destination: tested
      outputs: [package]
    cache: false
    steps:
      - run:
          - python3
          - -c
          - |
            import hashlib, json
            from pathlib import Path
            data = Path("tested/value.txt").read_bytes()
            Path("package").mkdir()
            Path("package/value.txt").write_bytes(data)
            Path("package/manifest.json").write_text(json.dumps({"producerSHA256": hashlib.sha256(data).hexdigest()}) + "\n")
            print("HOST_PACKAGE_EXECUTED_AFTER_ALL_GATES")
